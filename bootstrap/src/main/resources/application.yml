spring:
  application:
    name: baton
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 1000
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=2
  transaction:
    default-timeout: 7s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      client:
        # BATON 게이트가 닫힌 동안 등록 키를 두지 않는다. 부트스트랩 호환성 프로세서는
        # 기존 BATON 환경 변수·설정 트리 자격 증명을 게이트가 열린 뒤에만 Spring Boot의
        # 표준 등록 바인딩으로 매핑한다.
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: ${BATON_SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-system}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

baton:
  calendar:
    capture-enabled: ${BATON_CAL_CAPTURE_ENABLED:false}
    backfill-enabled: ${BATON_CAL_BACKFILL_ENABLED:false}
    delivery-enabled: ${BATON_CAL_DELIVERY_ENABLED:false}
    base-url: ${BATON_CAL_BASE_URL:}
    bearer-token: ${BATON_CAL_BEARER_TOKEN:}
    connect-timeout: ${BATON_CAL_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${BATON_CAL_READ_TIMEOUT:PT5S}
    dispatch-interval: ${BATON_CAL_DISPATCH_INTERVAL:PT10S}
  auth:
    local-registration-enabled: ${BATON_AUTH_LOCAL_REGISTRATION_ENABLED:false}
    oauth2:
      enabled: ${BATON_AUTH_OAUTH2_ENABLED:false}
  identity:
    email-verification:
      delivery: ${BATON_EMAIL_VERIFICATION_DELIVERY:disabled}
      public-base-url: ${BATON_PUBLIC_BASE_URL:}
      from-address: ${BATON_EMAIL_FROM_ADDRESS:}
      outbox-encryption-key: ${BATON_EMAIL_VERIFICATION_OUTBOX_ENCRYPTION_KEY:}
      dispatch-interval: ${BATON_EMAIL_VERIFICATION_DISPATCH_INTERVAL:PT10S}
      expiry-interval: ${BATON_EMAIL_VERIFICATION_EXPIRY_INTERVAL:PT1M}
  round:
    participation-grant:
      enabled: ${BATON_ROUND_PARTICIPATION_GRANT_ENABLED:false}
      issuer: ${BATON_ROUND_PARTICIPATION_GRANT_ISSUER:}
      audience: ${BATON_ROUND_PARTICIPATION_GRANT_AUDIENCE:round}
      current-key:
        kid: ${BATON_ROUND_PARTICIPATION_GRANT_CURRENT_KID:}
        private-key-path: ${BATON_ROUND_PARTICIPATION_GRANT_PRIVATE_KEY_PATH:}
        public-key-path: ${BATON_ROUND_PARTICIPATION_GRANT_PUBLIC_KEY_PATH:}
      previous-public-keys:
        - kid: ${BATON_ROUND_PARTICIPATION_GRANT_PREVIOUS_KID:}
          public-key-path: ${BATON_ROUND_PARTICIPATION_GRANT_PREVIOUS_PUBLIC_KEY_PATH:}
  round-automation:
    poll-interval: ${BATON_ROUND_AUTOMATION_POLL_INTERVAL:PT1M}
  brief:
    delivery-enabled: ${BATON_BRIEF_DELIVERY_ENABLED:false}
    base-url: ${BATON_BRIEF_BASE_URL:}
    bearer-token: ${BATON_BRIEF_BEARER_TOKEN:}
    connect-timeout: ${BATON_BRIEF_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${BATON_BRIEF_READ_TIMEOUT:PT5S}
    dispatch-interval: ${BATON_BRIEF_DISPATCH_INTERVAL:PT10S}
  watch:
    enabled: ${BATON_WATCH_ENABLED:false}
    monitoring-enabled: ${BATON_WATCH_MONITORING_ENABLED:true}
    base-url: ${BATON_WATCH_BASE_URL:}
    bearer-token: ${BATON_WATCH_BEARER_TOKEN:}
    source-namespace: ${BATON_WATCH_SOURCE_NAMESPACE:}
    event-receiver:
      enabled: ${BATON_WATCH_EVENT_RECEIVER_ENABLED:false}
      bearer-token: ${BATON_WATCH_EVENT_RECEIVER_BEARER_TOKEN:}
    connect-timeout: ${BATON_WATCH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${BATON_WATCH_READ_TIMEOUT:PT5S}
    dispatch-interval: ${BATON_WATCH_DISPATCH_INTERVAL:PT10S}
    reconciliation-initial-delay: ${BATON_WATCH_RECONCILIATION_INITIAL_DELAY:PT10S}
    reconciliation-interval: ${BATON_WATCH_RECONCILIATION_INTERVAL:PT6H}
  workspace:
    creation-key: ${BATON_WORKSPACE_CREATION_KEY:}
    recovery-key: ${BATON_WORKSPACE_RECOVERY_KEY:}
