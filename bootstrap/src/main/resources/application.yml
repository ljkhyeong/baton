spring:
  application:
    name: baton
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${BATON_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

baton:
  workspace:
    creation-key: ${BATON_WORKSPACE_CREATION_KEY:}
    recovery-key: ${BATON_WORKSPACE_RECOVERY_KEY:}
