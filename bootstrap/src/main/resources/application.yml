spring:
  application:
    name: baton
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 1000
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=2
  transaction:
    default-timeout: 7s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${BATON_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        path: /
        same-site: lax

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-system}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

baton:
  round-automation:
    poll-interval: ${BATON_ROUND_AUTOMATION_POLL_INTERVAL:PT1M}
  workspace:
    creation-key: ${BATON_WORKSPACE_CREATION_KEY:}
    recovery-key: ${BATON_WORKSPACE_RECOVERY_KEY:}
  identity:
    bootstrap-key: ${BATON_IDENTITY_BOOTSTRAP_KEY:}
    invitation-hmac-secret: ${BATON_IDENTITY_INVITATION_HMAC_SECRET:}
    bootstrap-invitation-ttl: ${BATON_IDENTITY_BOOTSTRAP_INVITATION_TTL:PT1H}
    member-invitation-ttl: ${BATON_IDENTITY_MEMBER_INVITATION_TTL:PT24H}
    oidc:
      enabled: ${BATON_IDENTITY_OIDC_ENABLED:false}
  integrations:
    go:
      enabled: ${BATON_GO_ENABLED:false}
      base-url: ${BATON_GO_BASE_URL:http://localhost:8080}
      public-base-url: ${BATON_GO_PUBLIC_BASE_URL:http://localhost:8080}
      management-token: ${BATON_GO_MANAGEMENT_TOKEN:}
      round-public-base-url: ${BATON_ROUND_PUBLIC_BASE_URL:http://localhost:5174}
      connect-timeout: ${BATON_GO_CONNECT_TIMEOUT:500ms}
      read-timeout: ${BATON_GO_READ_TIMEOUT:2s}
