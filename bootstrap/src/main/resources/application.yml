spring:
  application:
    name: baton
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 1000
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=2
  transaction:
    default-timeout: 7s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${BATON_RELAY_RABBITMQ_HOST:localhost}
    port: ${BATON_RELAY_RABBITMQ_PORT:5672}
    username: ${BATON_RELAY_RABBITMQ_USERNAME:guest}
    password: ${BATON_RELAY_RABBITMQ_PASSWORD:guest}
    virtual-host: ${BATON_RELAY_RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: ${BATON_RELAY_RABBITMQ_CONNECTION_TIMEOUT:2s}
    publisher-confirm-type: simple
    publisher-returns: false

server:
  port: ${BATON_SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-system}] "

management:
  health:
    rabbit:
      enabled: ${BATON_RELAY_PUBLISHER_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

baton:
  round-automation:
    poll-interval: ${BATON_ROUND_AUTOMATION_POLL_INTERVAL:PT1M}
  watch:
    enabled: ${BATON_WATCH_ENABLED:false}
    monitoring-enabled: ${BATON_WATCH_MONITORING_ENABLED:true}
    base-url: ${BATON_WATCH_BASE_URL:}
    bearer-token: ${BATON_WATCH_BEARER_TOKEN:}
    source-namespace: ${BATON_WATCH_SOURCE_NAMESPACE:}
    connect-timeout: ${BATON_WATCH_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${BATON_WATCH_READ_TIMEOUT:PT5S}
    dispatch-interval: ${BATON_WATCH_DISPATCH_INTERVAL:PT10S}
    reconciliation-initial-delay: ${BATON_WATCH_RECONCILIATION_INITIAL_DELAY:PT10S}
    reconciliation-interval: ${BATON_WATCH_RECONCILIATION_INTERVAL:PT6H}
  relay:
    publisher:
      enabled: ${BATON_RELAY_PUBLISHER_ENABLED:false}
      broker-host: ${BATON_RELAY_RABBITMQ_HOST:}
      broker-port: ${BATON_RELAY_RABBITMQ_PORT:0}
      broker-username: ${BATON_RELAY_RABBITMQ_USERNAME:}
      broker-password: ${BATON_RELAY_RABBITMQ_PASSWORD:}
      broker-virtual-host: ${BATON_RELAY_RABBITMQ_VIRTUAL_HOST:}
      exchange-name: ${BATON_RELAY_RABBITMQ_EXCHANGE:baton.events.v1}
      routing-key: ${BATON_RELAY_RABBITMQ_ROUTING_KEY:relay.events.v1}
      confirm-timeout: ${BATON_RELAY_CONFIRM_TIMEOUT:PT5S}
      dispatch-interval: ${BATON_RELAY_DISPATCH_INTERVAL:PT10S}
  workspace:
    creation-key: ${BATON_WORKSPACE_CREATION_KEY:}
    recovery-key: ${BATON_WORKSPACE_RECOVERY_KEY:}
