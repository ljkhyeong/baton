spring:
  application:
    name: baton
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 1000
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=2
  transaction:
    default-timeout: 7s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${BATON_SERVER_PORT:8080}
  shutdown: graceful

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-system}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

baton:
  workspace:
    creation-key: ${BATON_WORKSPACE_CREATION_KEY:}
    recovery-key: ${BATON_WORKSPACE_RECOVERY_KEY:}
