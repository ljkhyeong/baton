plugins {
	id 'org.springframework.boot'
}

springBoot {
	mainClass = 'com.personal.baton.BatonApplication'
}

dependencies {
	implementation project(':domain')
	implementation project(':application')
	implementation project(':adapter-in-web')
	implementation project(':adapter-out-persistence')
	implementation project(':adapter-out-external')

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.sentry:sentry-spring-boot-4-starter:8.56.0'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-mail'
	implementation 'org.springframework:spring-jdbc'
	implementation 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'jakarta.servlet:jakarta.servlet-api'
	testImplementation 'org.springframework.boot:spring-boot-web-server'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
