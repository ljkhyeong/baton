name: 외부 상태 감시

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      health_url:
        description: /actuator/health로 끝나는 공개 HTTPS URL이며 비어 있으면 BATON_HEALTH_URL을 사용합니다
        required: false
        type: string

permissions:
  contents: read

jobs:
  public_health:
    name: 공개 HTTPS 상태 확인
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BATON_EXTERNAL_MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      BATON_HEALTH_URL: ${{ github.event.inputs.health_url || vars.BATON_HEALTH_URL }}
      BATON_HEALTH_CONNECT_TIMEOUT_SECONDS: '5'
      BATON_HEALTH_TIMEOUT_SECONDS: '15'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 공개 서비스 상태 확인
        run: |
          for attempt in 1 2; do
            if bash ops/check-service-health.sh; then
              exit 0
            fi
            if [[ "$attempt" -eq 1 ]]; then
              printf 'Public health attempt failed; retrying in 30 seconds.\n' >&2
              sleep 30
            fi
          done
          exit 1
