name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend_contract:
    name: Backend and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Docker for Testcontainers
        run: docker info
      - name: Install API contract toolchain
        working-directory: frontend
        run: npm ci
      - name: Run backend regression and check API contract drift
        run: ./gradlew --no-daemon build checkApiContract

  frontend:
    name: Frontend production and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  production_package:
    name: Production package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BATON_HOST: ci.baton.invalid
      BATON_DB_NAME: baton
      BATON_DB_USERNAME: baton_ci
      BATON_DB_PASSWORD: ci-database-password-not-a-secret
      BATON_DB_ROOT_PASSWORD: ci-root-password-not-a-secret
      BATON_WORKSPACE_CREATION_KEY: ci-creation-key-0000000000000000000000000001
      BATON_WORKSPACE_RECOVERY_KEY: ci-recovery-key-0000000000000000000000000002
    steps:
      - uses: actions/checkout@v6
      - name: Validate operational scripts
        run: bash -n ops/backup.sh ops/restore.sh
      - name: Validate production Compose
        run: docker compose -f compose.production.yml config --quiet
      - name: Build production images
        run: docker compose -f compose.production.yml build app web

  contract:
    name: contract
    if: ${{ always() }}
    needs:
      - backend_contract
      - frontend
      - production_package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check
        env:
          BACKEND_CONTRACT_RESULT: ${{ needs.backend_contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PRODUCTION_PACKAGE_RESULT: ${{ needs.production_package.result }}
        run: |
          test "$BACKEND_CONTRACT_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$PRODUCTION_PACKAGE_RESULT" = success
