name: 품질 게이트

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend_contract:
    name: 백엔드 및 API 계약
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testcontainers용 Docker 확인
        run: docker info
      - name: API 계약 도구 설치
        working-directory: frontend
        run: npm ci
      - name: 백엔드 회귀 테스트 및 API 계약 드리프트 확인
        run: ./gradlew --no-daemon build checkApiContract

  frontend:
    name: 프런트엔드 프로덕션 빌드 및 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프런트엔드 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 프런트엔드와 Playwright 타입 검사
        working-directory: frontend
        run: npm run typecheck
      - name: 소스맵 업로드·배포 파일 검증
        working-directory: frontend
        run: npm run check:sourcemaps
      - name: 프런트엔드 빌드
        working-directory: frontend
        run: npm run build
      - name: Chromium과 WebKit 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: 프런트엔드 E2E 실행
        working-directory: frontend
        run: npm run e2e
      - name: Playwright 실패 보고서 업로드
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  fullstack_e2e:
    name: 전체 스택 파일럿 스모크
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 격리된 MySQL용 Docker 확인
        run: docker info
      - name: 프런트엔드 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: Chromium 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 전체 스택 파일럿 스모크 실행
        working-directory: frontend
        run: npm run e2e:fullstack
      - name: 전체 스택 실패 보고서 업로드
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-fullstack-report
          path: |
            frontend/playwright-report/fullstack/
            frontend/test-results/fullstack/
            frontend/test-results/fullstack-runtime/
          if-no-files-found: ignore
          retention-days: 7

  production_package:
    name: 프로덕션 패키지 및 런타임 스모크
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BATON_HOST: ci.baton.invalid
      BATON_DB_NAME: baton
      BATON_DB_USERNAME: baton_ci
      BATON_DB_PASSWORD: ci-database-password-not-a-secret
      BATON_DB_ROOT_PASSWORD: ci-root-password-not-a-secret
      BATON_WORKSPACE_CREATION_KEY: ci-creation-key-0000000000000000000000000001
      BATON_WORKSPACE_RECOVERY_KEY: ci-recovery-key-0000000000000000000000000002
      BATON_EFFECTIVE_ROUND_UID: 10001
      BATON_EFFECTIVE_ROUND_GID: 10001
      BATON_EFFECTIVE_ROUND_TURN_SHARED_SECRET_FILE: /dev/null
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: 운영 스크립트 검증 및 린트
        run: bash ops/check-shell-scripts.sh
      - name: 백업 생명주기 테스트
        run: bash ops/tests/backup-cycle-test.sh
      - name: 파일럿 프로덕션 준비 상태 검사 테스트
        run: bash ops/tests/pilot-readiness-test.sh
      - name: 외부 연동 전달 장애 점검 테스트
        run: bash ops/tests/integration-delivery-check-test.sh
      - name: Prometheus 경보·SMTP 알림·HTTPS 검사 설정 확인
        run: bash ops/tests/integration-alerts-test.sh
      - name: 운영 systemd 유닛 검증
        run: |
          systemd-analyze verify \
            ops/systemd/baton-backup.service \
            ops/systemd/baton-backup.timer \
            ops/systemd/baton-service-health.service \
            ops/systemd/baton-service-health.timer \
            ops/systemd/baton-backup-freshness.service \
            ops/systemd/baton-backup-freshness.timer \
            ops/systemd/baton-integration-delivery.service \
            ops/systemd/baton-integration-delivery.timer
          systemd-analyze calendar '*-*-* 03:15:00 Asia/Seoul'
      - name: 프로덕션 Compose 검증
        run: >-
          docker compose
          -f compose.production.yml
          -f compose.round.production.yml
          config --quiet
      - name: 프로덕션 런타임 스모크 빌드 및 실행
        run: bash ops/tests/production-runtime-smoke.sh
      - name: 프로덕션 런타임 실패 보고서 업로드
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-runtime-smoke-report
          path: build/reports/production-runtime-smoke/
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: contract
    if: ${{ always() }}
    needs:
      - backend_contract
      - frontend
      - fullstack_e2e
      - production_package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 품질 검사 통과 확인
        env:
          BACKEND_CONTRACT_RESULT: ${{ needs.backend_contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FULLSTACK_E2E_RESULT: ${{ needs.fullstack_e2e.result }}
          PRODUCTION_PACKAGE_RESULT: ${{ needs.production_package.result }}
        run: |
          test "$BACKEND_CONTRACT_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$FULLSTACK_E2E_RESULT" = success
          test "$PRODUCTION_PACKAGE_RESULT" = success
