version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: mysql
      - dependency-name: caddy
    ignore:
      # MySQL 8.4 LTS와 Caddy 2의 상위 계열 전환은 별도로 검토한다.
      - dependency-name: mysql
        versions: ['>= 8.5']
      - dependency-name: caddy
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        patterns: ['*']
