version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns:
          - '*'
        # 메이저 업데이트는 그룹 전체를 막지 않도록 개별 PR로 연다.
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - '*'
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Java 21 LTS 실행 이미지의 상위 계열 전환은 별도로 검토한다.
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # `.nvmrc`의 Node 22 LTS와 맞추며 상위 계열 전환은 별도로 검토한다.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: mysql
      - dependency-name: caddy
    ignore:
      # MySQL 8.4 LTS와 Caddy 2의 상위 계열 전환은 별도로 검토한다.
      - dependency-name: mysql
        versions: ['>= 8.5']
      - dependency-name: caddy
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        patterns: ['*']
