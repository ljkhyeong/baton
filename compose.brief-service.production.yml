services:
  app:
    environment:
      BATON_BRIEF_SERVICE_API_ENABLED: "true"
      BATON_BRIEF_SERVICE_API_BASE_URL: "https://${BATON_BRIEF_SERVICE_HOST:?BATON_BRIEF_SERVICE_HOST is required}:8443"
      BATON_BRIEF_SERVICE_API_SSL_BUNDLE: brief-service
    secrets:
      - source: baton_brief_service_api_bearer_token
        target: /run/baton-config/baton.brief.service-api.bearer-token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: baton_brief_service_trusted_certificate
        target: /run/baton-config/spring.ssl.bundle.pem.brief-service.truststore.certificate
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - brief_service

networks:
  brief_service:
    external: true
    name: "${BATON_BRIEF_PRIVATE_NETWORK:?BATON_BRIEF_PRIVATE_NETWORK is required}"

# file 비밀은 호스트 소유권 그대로 바인드돼 UID 10001 앱이 읽지 못하므로 환경 전달을 쓴다.
secrets:
  baton_brief_service_api_bearer_token:
    environment: BATON_SECRET_BRIEF_SERVICE_API_BEARER_TOKEN
  baton_brief_service_trusted_certificate:
    environment: BATON_SECRET_BRIEF_SERVICE_TRUSTED_CERTIFICATE
