groups:
  - name: baton-integrations
    rules:
      # 오래된 캐시나 빠진 지표를 정상 전달 상태로 판단하지 않는다.
      - record: baton:integration_metrics_ready
        expr: |
          (up{job="baton"} == 1)
          and on (job, instance) (baton_integration_metrics_refresh_success{job="baton"} == 1)
          and on (job, instance) (baton_integration_metrics_last_successful_refresh_time_seconds{job="baton"} > 0)
          and on (job, instance) (time() - baton_integration_metrics_last_successful_refresh_time_seconds{job="baton"} >= 0)
          and on (job, instance) (time() - baton_integration_metrics_last_successful_refresh_time_seconds{job="baton"} <= 120)
          and on (job, instance) (
            count by (job, instance) (
              {__name__=~"baton_integration_delivery_(actionable_failed|expired_processing)_items",
               job="baton", integration=~"calendar|calendar_metadata|watch|brief|email"} >= 0
            ) == 10
          )

      - alert: BatonMetricsUnavailable
        expr: up{job="baton"} == 0 or absent(up{job="baton"})
        for: 2m
        labels:
          service: baton
          severity: critical
        annotations:
          summary: BATON 지표를 수집하지 못하고 있습니다.
          description: 앱 상태와 루프백 수집 경로를 확인하세요.

      - alert: BatonIntegrationMetricsInvalid
        expr: (up{job="baton"} == 1) unless on (job, instance) baton:integration_metrics_ready
        for: 2m
        labels:
          service: baton
          severity: warning
        annotations:
          summary: BATON 연동 상태를 확인할 수 없습니다.
          description: 지표 누락, 갱신 실패 또는 갱신 시각을 확인하세요. 저장된 실패 건수가 0이어도 정상으로 판단할 수 없습니다.

      - alert: BatonIntegrationDeliveryFailed
        expr: |
          (baton_integration_delivery_actionable_failed_items{job="baton"} > 0)
          and on (job, instance) baton:integration_metrics_ready
        for: 5m
        labels:
          service: baton
          severity: warning
        annotations:
          summary: '{{ $labels.integration }} 전달에 조치가 필요합니다.'
          description: 재시도가 끝난 실패 항목이 있습니다. 연동 설정과 실패 원인을 확인하세요.

      - alert: BatonIntegrationProcessingExpired
        expr: |
          (baton_integration_delivery_expired_processing_items{job="baton"} > 0)
          and on (job, instance) baton:integration_metrics_ready
        for: 5m
        labels:
          service: baton
          severity: warning
        annotations:
          summary: '{{ $labels.integration }} 전달 처리가 지연되고 있습니다.'
          description: 처리 기한을 넘긴 항목이 남아 있습니다. 전달 작업자와 재처리를 확인하세요.
