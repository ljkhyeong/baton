services:
  mysql:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  app:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  web:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  round-web:
    image: ${BATON_RECOVERY_REHEARSAL_WEB_IMAGE:?BATON_RECOVERY_REHEARSAL_WEB_IMAGE is required}
    volumes:
      - ${BATON_RECOVERY_REHEARSAL_ROUND_MOCK_CADDYFILE:?BATON_RECOVERY_REHEARSAL_ROUND_MOCK_CADDYFILE is required}:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      start_period: 3s
      retries: 30
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  round-signaling:
    image: ${BATON_RECOVERY_REHEARSAL_WEB_IMAGE:?BATON_RECOVERY_REHEARSAL_WEB_IMAGE is required}
    volumes:
      - ${BATON_RECOVERY_REHEARSAL_ROUND_MOCK_CADDYFILE:?BATON_RECOVERY_REHEARSAL_ROUND_MOCK_CADDYFILE is required}:/etc/caddy/Caddyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -r /run/secrets/round.turn.shared-secret
          && test "$$(wc -c < /run/secrets/round.turn.shared-secret)" = 64
          && wget -q -T 2 -O /dev/null http://127.0.0.1:8787/healthz
      interval: 2s
      timeout: 3s
      start_period: 3s
      retries: 30
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}

networks:
  data:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  edge:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  round_web:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  round_signaling:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}

volumes:
  baton_mysql_data:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  baton_caddy_data:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
  baton_caddy_config:
    labels:
      com.personal.baton.recovery-rehearsal: ${BATON_RECOVERY_REHEARSAL_RUN_ID:?BATON_RECOVERY_REHEARSAL_RUN_ID is required}
