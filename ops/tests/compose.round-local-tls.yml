services:
  mysql:
    restart: "no"
    volumes: !override []
    tmpfs:
      - /var/lib/mysql:size=512m,mode=0700

  mock-oidc:
    image: ${NODE_IMAGE:-node:22.23.0-alpine3.24}
    restart: "no"
    working_dir: /workspace
    command:
      - node
      - /workspace/frontend/tests/support/mock-oidc-provider.mjs
    environment:
      BATON_MOCK_OIDC_BIND_HOST: 0.0.0.0
      BATON_MOCK_OIDC_PORT: "19090"
      BATON_MOCK_OIDC_ISSUER: https://accounts.google.com
      BATON_MOCK_OIDC_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:?OIDC client id is required}
      BATON_MOCK_OIDC_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:?OIDC client secret is required}
      BATON_MOCK_OIDC_REDIRECT_URI: https://baton.localhost/api/v1/auth/oidc/callback/google
    ports:
      - "127.0.0.1:19090:19090/tcp"
    volumes:
      - ./frontend/tests/support/mock-oidc-provider.mjs:/workspace/frontend/tests/support/mock-oidc-provider.mjs:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  app:
    restart: "no"
    environment:
      BATON_IDENTITY_OIDC_ENABLED: "true"
      BATON_GO_ENABLED: "false"
      BATON_ROUND_PUBLIC_BASE_URL: https://baton.localhost
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: openid
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI: http://127.0.0.1:19090/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI: http://mock-oidc:19090/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI: http://mock-oidc:19090/jwks
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI: http://mock-oidc:19090/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_NAME_ATTRIBUTE: sub
    ports:
      - "127.0.0.1:18080:8080/tcp"
    depends_on:
      mock-oidc:
        condition: service_started

  round-web:
    build:
      context: ${ROUND_REPOSITORY_ROOT:?ROUND_REPOSITORY_ROOT is required}
      dockerfile: Dockerfile
      target: baton-web-runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.0-alpine3.24}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
        VITE_STUN_URLS: ""
        VITE_ICE_TRANSPORT_POLICY: relay
    restart: "no"

  web:
    restart: "no"
    ports: !override
      - "127.0.0.1:443:443/tcp"
    depends_on:
      app:
        condition: service_healthy
      round-web:
        condition: service_healthy

  round-truststore:
    image: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23}
    restart: "no"
    command:
      - sh
      - -ec
      - |
        certificate=/data/caddy/pki/authorities/local/root.crt
        for attempt in $$(seq 1 90); do
          if [ -s "$$certificate" ]; then
            keytool -importcert -noprompt \
              -alias baton-local-caddy \
              -file "$$certificate" \
              -keystore /trust/baton-local.p12 \
              -storetype PKCS12 \
              -storepass changeit
            exit 0
          fi
          sleep 1
        done
        echo 'Caddy local CA was not created in time' >&2
        exit 1
    volumes:
      - baton_caddy_data:/data:ro
      - round_local_truststore:/trust
    depends_on:
      web:
        condition: service_started
    networks:
      - round
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  round-signaling:
    build:
      context: ${ROUND_REPOSITORY_ROOT:?ROUND_REPOSITORY_ROOT is required}
      dockerfile: Dockerfile
      target: signaling-runtime
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-alpine-3.23}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23}
    restart: "no"
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      TURN_SHARED_SECRET: !reset null
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp
        -Djavax.net.ssl.trustStore=/run/round-trust/baton-local.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
    secrets:
      - source: round_local_turn_shared_secret
        target: TURN_SHARED_SECRET
    volumes:
      - round_local_truststore:/run/round-trust:ro
    depends_on:
      round-truststore:
        condition: service_completed_successfully

  round-turn:
    image: ${ROUND_LOCAL_TURN_IMAGE:?ROUND_LOCAL_TURN_IMAGE is required}
    build:
      context: ${ROUND_REPOSITORY_ROOT:?ROUND_REPOSITORY_ROOT is required}
      dockerfile: Dockerfile
      target: turn-runtime
      args:
        COTURN_IMAGE: ${COTURN_IMAGE:-coturn/coturn:4.14.0-r0-alpine}
    restart: "no"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/round-local-turn-entrypoint
    command: []
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:49160-49169:49160-49169/udp"
    networks:
      - edge
    secrets:
      - source: round_local_turn_shared_secret
        target: round-local-turn-shared-secret
    volumes:
      - ./ops/tests/round-local-turn-entrypoint.sh:/usr/local/bin/round-local-turn-entrypoint:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/coturn:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - turnutils_stunclient -p 3478 127.0.0.1 >/dev/null 2>&1
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  round_local_truststore:

secrets:
  round_local_turn_shared_secret:
    file: ${ROUND_LOCAL_TURN_SHARED_SECRET_FILE:?ROUND_LOCAL_TURN_SHARED_SECRET_FILE is required}
