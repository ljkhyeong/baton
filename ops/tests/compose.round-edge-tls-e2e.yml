x-round-edge-labels: &round-edge-labels
  io.baton.test.kind: round-edge-tls-e2e
  io.baton.test.run: ${BATON_ROUND_EDGE_RUN_TOKEN:?ROUND edge run token is required}

services:
  mysql:
    restart: "no"
    labels: *round-edge-labels

  mock-oidc:
    image: ${NODE_IMAGE:-node:22.23.0-alpine3.24}
    restart: "no"
    labels: *round-edge-labels
    working_dir: /workspace
    command:
      - node
      - /workspace/frontend/tests/support/mock-oidc-provider.mjs
    environment:
      BATON_MOCK_OIDC_BIND_HOST: 0.0.0.0
      BATON_MOCK_OIDC_PORT: "19090"
      BATON_MOCK_OIDC_PUBLIC_BASE_URL: http://127.0.0.1:${BATON_ROUND_EDGE_OIDC_PORT:?OIDC port is required}
      BATON_MOCK_OIDC_ISSUER: https://accounts.google.com
      BATON_MOCK_OIDC_CLIENT_ID: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:?OIDC client id is required}
      BATON_MOCK_OIDC_CLIENT_SECRET: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:?OIDC client secret is required}
      BATON_MOCK_OIDC_REDIRECT_URI: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}/api/v1/auth/oidc/callback/google
      BATON_MOCK_OIDC_SUBJECT: owner
    ports:
      - "127.0.0.1:${BATON_ROUND_EDGE_OIDC_PORT}:19090/tcp"
    volumes:
      - ./frontend/tests/support/mock-oidc-provider.mjs:/workspace/frontend/tests/support/mock-oidc-provider.mjs:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:19090/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  app:
    restart: "no"
    labels: *round-edge-labels
    environment:
      BATON_IDENTITY_OIDC_ENABLED: "true"
      BATON_GO_ENABLED: "false"
      BATON_ROUND_PUBLIC_BASE_URL: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
      BATON_ROUND_GRANT_ISSUER: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
      BATON_ROUND_GRANT_ROUND_PUBLIC_ORIGIN: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE: openid
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI: http://127.0.0.1:${BATON_ROUND_EDGE_OIDC_PORT:?OIDC port is required}/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI: http://mock-oidc:19090/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI: http://mock-oidc:19090/jwks
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI: http://mock-oidc:19090/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_NAME_ATTRIBUTE: sub
    depends_on:
      mock-oidc:
        condition: service_healthy

  round-web:
    image: ${BATON_ROUND_WEB_IMAGE:?ROUND web image is required}
    build:
      context: ${ROUND_REPOSITORY_ROOT:?ROUND repository root is required}
      dockerfile: Dockerfile
      target: baton-web-runtime
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.0-alpine3.24}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
        VITE_STUN_URLS: ""
        VITE_ICE_TRANSPORT_POLICY: relay
    restart: "no"
    labels: *round-edge-labels

  web:
    restart: "no"
    labels: *round-edge-labels
    environment:
      BATON_HTTPS_FORWARD_PORT: ${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
    depends_on:
      round-web:
        condition: service_healthy

  round-truststore:
    image: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23}
    restart: "no"
    labels: *round-edge-labels
    command:
      - sh
      - -ec
      - |
        certificate=/data/caddy/pki/authorities/local/root.crt
        for attempt in $$(seq 1 90); do
          if [ -s "$$certificate" ]; then
            keytool -importcert -noprompt \
              -alias baton-local-caddy \
              -file "$$certificate" \
              -keystore /trust/baton-local.p12 \
              -storetype PKCS12 \
              -storepass changeit
            exit 0
          fi
          sleep 1
        done
        echo 'Caddy local CA was not created in time' >&2
        exit 1
    volumes:
      - baton_caddy_data:/data:ro
      - round_edge_truststore:/trust
    depends_on:
      web:
        condition: service_started
    networks:
      - round
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  round-signaling:
    image: ${BATON_ROUND_SIGNALING_IMAGE:?ROUND signaling image is required}
    build:
      context: ${ROUND_REPOSITORY_ROOT:?ROUND repository root is required}
      dockerfile: Dockerfile
      target: signaling-runtime
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-eclipse-temurin:21.0.11_10-jdk-alpine-3.23}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21.0.11_10-jre-alpine-3.23}
    restart: "no"
    labels: *round-edge-labels
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError
        -Djava.io.tmpdir=/tmp
        -Djavax.net.ssl.trustStore=/run/round-trust/baton-local.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=changeit
      ROUND_AUTH_ISSUER: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
      ROUND_AUTH_JWK_SET_URI: https://baton.localhost/.well-known/jwks.json
      ALLOWED_ORIGINS: https://baton.localhost:${BATON_ROUND_EDGE_TLS_PORT:?TLS port is required}
      TURN_URLS: turn:127.0.0.1:9?transport=udp
      TURN_SHARED_SECRET: local-edge-test-only-shared-secret-not-for-relay
    volumes:
      - round_edge_truststore:/run/round-trust:ro
    depends_on:
      round-truststore:
        condition: service_completed_successfully

networks:
  data:
    labels: *round-edge-labels
  edge:
    labels: *round-edge-labels
  round:
    labels: *round-edge-labels

volumes:
  baton_mysql_data:
    labels: *round-edge-labels
  baton_caddy_data:
    labels: *round-edge-labels
  baton_caddy_config:
    labels: *round-edge-labels
  round_edge_truststore:
    labels: *round-edge-labels
