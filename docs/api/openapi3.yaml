            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 인수인계 항목 UUID
          in: path
          name: itemId
          required: true
          schema:
            format: uuid
            type: string
        - description: 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              updateHandoffItemCompletion:
                value: |-
                  {
                    "completed" : true
                  }
            schema:
              $ref: '#/components/schemas/Schema_5411bd92352a352b'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                updateHandoffItemCompletion:
                  value: |-
                    {
                      "id" : "77777777-7777-7777-7777-777777777777",
                      "roleId" : "44444444-4444-4444-4444-444444444444",
                      "label" : "질문 목록 문서 권한 넘기기",
                      "category" : "RESOURCE",
                      "completed" : true
                    }
              schema:
                $ref: '#/components/schemas/Schema_c89fa9c6bcf21bad'
      summary: 인수인계 항목 완료 상태 변경
      tags:
        - api
