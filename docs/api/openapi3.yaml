  /api/v1/teams/{teamId}/seasons/{seasonId}/handoff-items/{itemId}/completion:
    patch:
      description: 인수인계 항목의 완료 여부를 변경한다.
      operationId: updateHandoffItemCompletion
      parameters:
        - description: 팀 UUID
          in: path
