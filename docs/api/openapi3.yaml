  securitySchemes:
    batonSession:
      description: >-
        서버가 발급하고 폐기하는 host-only HttpOnly session cookie. 운영에서는 __Host-baton_session; Secure; SameSite=Lax; Path=/을 사용하고
        로컬 개발에서는 secure가 아닌 baton_session 이름과 같은 path를 사용한다. ROUND edge는 이 cookie를 정적·signaling·TURN upstream에서 제거한다.
      in: cookie
      name: __Host-baton_session
      type: apiKey
    identityBootstrapKey:
      description: 외부 edge에서 차단하고 신뢰한 내부 운영 경계에서만 사용하는 bootstrap 키
      in: header
      name: X-Baton-Identity-Bootstrap-Key
      type: apiKey
