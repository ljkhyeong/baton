              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                createWorkspaceInvalidIdempotencyKey:
                  value: |-
                    {
                      "code" : "INVALID_INPUT",
                      "message" : "멱등 키는 32자 이상 200자 이하의 URL 안전 ASCII 문자여야 합니다"
                    }
                createWorkspaceInvalidInput:
                  value: |-
