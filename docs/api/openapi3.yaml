          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                createWorkspaceIdempotencyKeyConflict:
                  value: |-
                    {
                      "code" : "IDEMPOTENCY_KEY_CONFLICT",
                      "message" : "동일한 멱등 키의 생성 요청이 처리 중입니다. 잠시 후 다시 시도해 주세요"
                    }
                createWorkspaceIdempotencyKeyReused:
                  value: |-
                    {
                      "code" : "IDEMPOTENCY_KEY_REUSED",
                      "message" : "동일한 멱등 키를 의미가 다른 생성 요청에 사용할 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '500':
          description: '500'
          content:
            application/json:
              examples:
                createWorkspaceInternalError:
                  value: |-
