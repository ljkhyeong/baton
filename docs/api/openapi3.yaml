            application/json:
              examples:
                createHandoffItem:
                  value: |-
                    {
                      "id" : "77777777-7777-7777-7777-777777777777",
                      "roleId" : "44444444-4444-4444-4444-444444444444",
                      "label" : "질문 목록 문서 권한 넘기기",
                      "category" : "RESOURCE",
                      "completed" : false
                    }
              schema:
                $ref: '#/components/schemas/Schema_c89fa9c6bcf21bad'
      summary: 인수인계 항목 생성
