openapi: 3.0.1
info:
  title: BATON API
  description: 조직의 역할, 루틴, 결정과 인수인계를 이어 주는 BATON HTTP API
  version: 0.1.0
servers:
  - url: /
paths:
  /.well-known/round-participation-jwks.json:
    get:
      description: ROUND가 BATON 참여권 서명을 검증할 현재·이전 공개 RSA 키만 JWK Set으로 조회한다.
      operationId: getRoundParticipationJwkSet
      responses:
        '200':
          description: '200'
          content:
            application/jwk-set+json:
              examples:
                getRoundParticipationJwkSet:
                  value: |-
                    {
                      "keys" : [ {
                        "kty" : "RSA",
                        "kid" : "baton-round-current",
                        "use" : "sig",
                        "alg" : "RS256",
                        "n" : "base64url-modulus",
                        "e" : "AQAB"
                      } ]
                    }
              schema:
                $ref: '#/components/schemas/Schema_c2944e6f33f5d617'
          headers:
            Cache-Control:
              description: 60초 공개 캐시 지시자
              schema:
                type: string
            Content-Type:
              description: 표준 JWK Set 미디어 타입
              schema:
                type: string
      summary: ROUND 참여권 JWK Set 조회
      tags:
        - .well-known
  /api/v1/account-membership-claims:
    post:
      description: 화면에서 확인한 계정과 로그인 계정이 같을 때 워크스페이스 접근 키로 기존 활성 구성원 하나를 연결한다.
      operationId: claimAccountMembership
      parameters:
        - description: 연결 또는 매핑 대상 워크스페이스 접근 키
          example: workspace-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              claimAccountMembership:
                value: |-
                  {
                    "expectedAccountId" : "8e448211-66ae-44ab-9888-c4960648c22b",
                    "teamId" : "11111111-1111-4111-8111-111111111111",
                    "seasonId" : "22222222-2222-4222-8222-222222222222",
                    "memberId" : "33333333-3333-4333-8333-333333333333"
                  }
              claimAccountMembershipAccountChanged:
                value: |-
                  {
                    "expectedAccountId" : "8e448211-66ae-44ab-9888-c4960648c22c",
                    "teamId" : "11111111-1111-4111-8111-111111111111",
                    "seasonId" : "22222222-2222-4222-8222-222222222222",
                    "memberId" : "33333333-3333-4333-8333-333333333333"
                  }
            schema:
              $ref: '#/components/schemas/Schema_892abbd42867bf81'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                claimAccountMembership:
                  value: |-
                    {
                      "accountId" : "8e448211-66ae-44ab-9888-c4960648c22b",
                      "teamId" : "11111111-1111-4111-8111-111111111111",
                      "memberId" : "33333333-3333-4333-8333-333333333333",
                      "claimedAt" : "2026-08-08T12:34:56Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_e7744faecbdb49bc'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                claimAccountMembershipAccountChanged:
                  value: |-
                    {
                      "code" : "ACCOUNT_MEMBERSHIP_CONFLICT",
                      "message" : "로그인 계정이 변경되었습니다. 새로고침한 뒤 연결할 계정을 다시 확인해 주세요."
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 계정 구성원 멤버십 연결
      tags:
        - api
  /api/v1/account-memberships/current:
    get:
      description: 인증된 BATON 계정과 현재 팀의 기존 구성원 연결 상태를 워크스페이스 접근 키로 조회한다.
      operationId: getCurrentAccountMembership
      parameters:
        - description: 연결 상태를 확인할 팀 UUID
          in: query
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 연결 상태를 확인할 팀의 워크스페이스 접근 키
          example: workspace-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getCurrentAccountMembership:
                  value: |-
                    {
                      "claimed" : false
                    }
                getCurrentAccountMembershipClaimed:
                  value: |-
                    {
                      "claimed" : true,
                      "accountId" : "8e448211-66ae-44ab-9888-c4960648c22b",
                      "teamId" : "11111111-1111-4111-8111-111111111111",
                      "memberId" : "33333333-3333-4333-8333-333333333333",
                      "claimedAt" : "2026-08-08T12:34:56Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_e249d91938b2aea4'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 현재 계정 구성원 연결 조회
      tags:
        - api
  /api/v1/auth/account:
    get:
      description: 현재 로그인 계정의 표시 이름과 연결된 로그인 수단을 조회한다. 공급자가 이메일을 제공하지 않으면 email은 null이다.
      operationId: getAccountSecurity
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getAccountSecurity:
                  value: |-
                    {
                      "accountId" : "8e448211-66ae-44ab-9888-c4960648c22b",
                      "displayName" : "박민서",
                      "identities" : [ {
                        "provider" : "google",
                        "email" : null,
                        "emailVerified" : false
                      }, {
                        "provider" : "local_email",
                        "email" : "member@example.com",
                        "emailVerified" : true
                      } ]
                    }
              schema:
                $ref: '#/components/schemas/Schema_baf1712ab0d6d81b'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 계정 보안 정보 조회
      tags:
        - api
  /api/v1/auth/csrf:
    get:
      description: 로그인·가입 등 쿠키 인증 변경 전에 사용할 CSRF 토큰을 준비한다.
      operationId: getAuthCsrf
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getAuthCsrf:
                  value: |-
                    {
                      "csrfHeaderName" : "X-CSRF-TOKEN",
                      "csrfToken" : "opaque-csrf-token"
                    }
              schema:
                $ref: '#/components/schemas/Schema_89a67e6a4a2dd84e'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 인증 CSRF 토큰 준비
      tags:
        - api
  /api/v1/auth/local/email-verifications:
    post:
      description: 일회성 이메일 검증 토큰을 소비하고 검증된 자체 이메일 계정의 최초 비밀번호 자격 증명을 만든다.
      operationId: verifyLocalEmail
      parameters:
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              verifyLocalEmail:
                value: |-
                  {
                    "token" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "password" : "correct horse battery staple"
                  }
              verifyLocalEmailTemporarilyUnavailable:
                value: |-
                  {
                    "token" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "password" : "correct horse battery staple"
                  }
            schema:
              $ref: '#/components/schemas/Schema_e7445cc2a46db86c'
        required: true
      responses:
        '204':
          description: '204'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '503':
          description: '503'
          content:
            application/json:
              examples:
                verifyLocalEmailTemporarilyUnavailable:
                  value: |-
                    {
                      "code" : "IDENTITY_TEMPORARILY_UNAVAILABLE",
                      "message" : "현재 인증 요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 자체 이메일 검증과 자격 증명 생성
      tags:
        - api
  /api/v1/auth/local/password-changes:
    post:
      description: 현재 자체 이메일 비밀번호를 확인해 새 비밀번호로 바꾸고 계정의 모든 기존 세션을 종료한다. 진행 중인 재설정 링크도 무효화한다.
      operationId: changeLocalPassword
      parameters:
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: http://localhost:8080
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              changeLocalPassword:
                value: |-
                  {
                    "currentPassword" : "correct horse battery staple",
                    "newPassword" : "new correct horse battery staple"
                  }
              changeLocalPasswordInvalidCurrentPassword:
                value: |-
                  {
                    "currentPassword" : "wrong current password",
                    "newPassword" : "new correct horse battery staple"
                  }
              changeLocalPasswordUnavailable:
                value: |-
                  {
                    "currentPassword" : "correct horse battery staple",
                    "newPassword" : "new correct horse battery staple"
                  }
            schema:
              $ref: '#/components/schemas/Schema_d8f66cf508ab48f9'
        required: true
      responses:
        '204':
          description: '204'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            Set-Cookie:
              description: 현재 JSESSIONID를 즉시 만료하는 쿠키
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                changeLocalPasswordInvalidCurrentPassword:
                  value: |-
                    {
                      "code" : "CURRENT_PASSWORD_INVALID",
                      "message" : "현재 비밀번호가 올바르지 않습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                changeLocalPasswordUnavailable:
                  value: |-
                    {
                      "code" : "LOCAL_PASSWORD_UNAVAILABLE",
                      "message" : "자체 이메일 비밀번호를 사용하는 계정이 아닙니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 자체 이메일 비밀번호 변경
      tags:
        - api
  /api/v1/auth/local/password-reset-requests:
    post:
      description: 인증된 자체 이메일 계정에 30분짜리 일회용 재설정 링크를 보낸다. 계정 존재 여부는 응답하지 않는다.
      operationId: requestPasswordReset
      parameters:
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              requestPasswordReset:
                value: |-
                  {
                    "email" : "member@example.com"
                  }
            schema:
              $ref: '#/components/schemas/Schema_3a4a0e7a2f90e51f'
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                requestPasswordReset:
                  value: |-
                    {
                      "accepted" : true
                    }
              schema:
                $ref: '#/components/schemas/Schema_d817bb4c7f28fd3d'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 비밀번호 재설정 메일 요청
      tags:
        - api
  /api/v1/auth/local/password-resets:
    post:
      description: 재설정 토큰을 소비하고 비밀번호와 계정 세션 버전을 변경한다. 기존 세션은 다음 요청부터 거부하며 자동 로그인하지 않는다.
      operationId: resetPassword
      parameters:
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              resetPassword:
                value: |-
                  {
                    "token" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "password" : "new correct horse battery staple"
                  }
              resetPasswordInvalidToken:
                value: |-
                  {
                    "token" : "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                    "password" : "new correct horse battery staple"
                  }
            schema:
              $ref: '#/components/schemas/Schema_8722349937f63e53'
        required: true
      responses:
        '204':
          description: '204'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                resetPasswordInvalidToken:
                  value: |-
                    {
                      "code" : "PASSWORD_RESET_INVALID",
                      "message" : "비밀번호 재설정 링크가 만료되었거나 이미 사용되었습니다. 새 링크를 요청해 주세요"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 비밀번호 재설정 완료
      tags:
        - api
  /api/v1/auth/local/registrations:
    post:
      description: 이메일 존재 여부를 노출하지 않고 자체 이메일 계정 등록과 검증 메일 발송을 요청한다.
      operationId: registerLocalAccount
      parameters:
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              registerLocalAccount:
                value: |-
                  {
                    "email" : "member@example.com",
                    "displayName" : "박민서"
                  }
              registerLocalAccountTemporarilyUnavailable:
                value: |-
                  {
                    "email" : "member@example.com",
                    "displayName" : "박민서"
                  }
            schema:
              $ref: '#/components/schemas/Schema_6a0ae0ae4f3b3839'
        required: true
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                registerLocalAccount:
                  value: |-
                    {
                      "verificationRequired" : true
                    }
              schema:
                $ref: '#/components/schemas/Schema_2a4f2da12175b82c'
          headers:
            Cache-Control:
