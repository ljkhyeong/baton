openapi: 3.0.1
info:
  title: BATON API
  description: 조직의 역할, 루틴, 결정과 인수인계를 이어 주는 BATON HTTP API
  version: 0.1.0
servers:
  - url: /
paths:
  /.well-known/jwks.json:
    get:
      description: ROUND가 RS256 참여권을 검증할 수 있도록 rotation 중인 RSA 공개키 집합만 반환한다.
      operationId: getRoundJwkSet
      parameters:
        - description: 이전에 받은 공개키 집합 ETag
          example: '"sha256-public-key-set"'
          in: header
          name: If-None-Match
          required: false
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getRoundJwkSet:
                  value: |-
                    {
                      "keys" : [ {
                        "kid" : "round-2026-07",
                        "kty" : "RSA",
                        "alg" : "RS256",
                        "use" : "sig",
                        "n" : "public-modulus",
                        "e" : "AQAB"
                      } ]
                    }
              schema:
                $ref: '#/components/schemas/Schema_5e94be56474df790'
          headers:
            Cache-Control:
              description: public, max-age=60, must-revalidate 캐시 지시자
              schema:
                type: string
            ETag:
              description: 공개키 집합 내용의 강한 ETag
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '304':
          description: '304'
          headers:
            Cache-Control:
              description: public, max-age=60, must-revalidate 캐시 지시자
              schema:
                type: string
            ETag:
              description: 현재 공개키 집합 ETag
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security: []
      summary: ROUND 참여권 공개키 조회
      tags:
        - .well-known
  /api/v1/auth/oidc/authorization/google:
    get:
      description: Authorization Code + PKCE를 시작하고 Google authorization endpoint로 이동한다.
      operationId: authorizeGoogleOidc
      responses:
        '302':
          description: Google authorization endpoint로 이동
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            Location:
              description: 브라우저가 이동할 다음 경로
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security: []
      summary: Google OIDC 로그인 시작
      tags:
        - api
  /api/v1/auth/oidc/callback/google:
    get:
      description: Google OIDC callback을 검증하고 성공하면 BATON session을 만든 뒤 홈으로 이동한다.
      operationId: handleGoogleOidcCallback
      responses:
        '302':
          description: 로그인 성공 후 홈으로 이동
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            Location:
              description: 브라우저가 이동할 다음 경로
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '401':
          description: OIDC 로그인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security: []
      summary: Google OIDC callback 처리
      tags:
        - api
  /api/v1/auth/session:
    get:
      description: 현재 BATON 로그인 여부와 인증 세션에 결속된 CSRF 토큰을 조회한다.
      operationId: getIdentitySession
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getIdentitySession:
                  value: |-
                    {
                      "authenticated" : true,
                      "accountId" : "22222222-2222-4333-8444-555555555555",
                      "csrfHeaderName" : "X-CSRF-TOKEN",
                      "csrfToken" : "<redacted>",
                      "oidcEnabled" : false
                    }
              schema:
                $ref: '#/components/schemas/Schema_aea1a5ef077f9f81'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security:
        - {}
        - batonSession: []
      summary: 로그인 세션 조회
      tags:
        - api
  /api/v1/identity/bootstrap-invitations:
    post:
      description: 운영자 bootstrap 키를 검증하고 기존 팀 구성원에 결속된 일회성 OWNER 초대를 발급한다.
      operationId: issueBootstrapInvitation
      parameters:
        - description: 외부 edge에서 차단하고 application이 검증하는 운영자 bootstrap 키
          in: header
          name: X-Baton-Identity-Bootstrap-Key
          required: true
          schema:
            type: string
        - description: 동일 발급 의도를 재시도하는 canonical UUID
          example: 66666666-2222-4333-8444-555555555555
          in: header
          name: Idempotency-Key
          required: true
          schema:
            format: uuid
            maxLength: 36
            minLength: 36
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            type: string
      requestBody:
        content:
          application/json:
            examples:
              issueBootstrapInvitation:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationConflict:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationForbidden:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationInvalidInput:
                value: |-
                  {
                    "teamId" : null,
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationNotFound:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationReplay:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
              issueBootstrapInvitationUnavailable:
                value: |-
                  {
                    "teamId" : "33333333-2222-4333-8444-555555555555",
                    "memberId" : "44444444-2222-4333-8444-555555555555"
                  }
            schema:
              $ref: '#/components/schemas/Schema_4ecfcb238443ecbf'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                issueBootstrapInvitationReplay:
                  value: |-
                    {
                      "invitationId" : "55555555-2222-4333-8444-555555555555",
                      "teamId" : "33333333-2222-4333-8444-555555555555",
                      "memberId" : "44444444-2222-4333-8444-555555555555",
                      "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
                      "issuedAt" : "2026-07-30T12:00:00Z",
                      "expiresAt" : "2026-07-30T13:00:00Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_796f1cdb58a3b0c8'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '201':
          description: '201'
          content:
            application/json:
              examples:
                issueBootstrapInvitation:
                  value: |-
                    {
                      "invitationId" : "55555555-2222-4333-8444-555555555555",
                      "teamId" : "33333333-2222-4333-8444-555555555555",
                      "memberId" : "44444444-2222-4333-8444-555555555555",
                      "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA",
                      "issuedAt" : "2026-07-30T12:00:00Z",
                      "expiresAt" : "2026-07-30T13:00:00Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_796f1cdb58a3b0c8'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                issueBootstrapInvitationInvalidInput:
                  value: |-
                    {
                      "code" : "INVALID_INPUT",
                      "message" : "teamId: must not be null"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '403':
          description: '403'
          content:
            application/json:
              examples:
                issueBootstrapInvitationForbidden:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_INVITATION_FORBIDDEN",
                      "message" : "bootstrap 초대를 발급할 권한이 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '404':
          description: '404'
          content:
            application/json:
              examples:
                issueBootstrapInvitationNotFound:
                  value: |-
                    {
                      "code" : "MEMBER_NOT_FOUND",
                      "message" : "구성원을 찾을 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                issueBootstrapInvitationConflict:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_TARGET_UNAVAILABLE",
                      "message" : "bootstrap 초대 대상을 사용할 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '503':
          description: '503'
          content:
            application/json:
              examples:
                issueBootstrapInvitationUnavailable:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_CONFIGURATION_INVALID",
                      "message" : "bootstrap 초대 발급 설정이 안전하지 않습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security:
        - identityBootstrapKey: []
      summary: 기존 팀 OWNER bootstrap 초대 발급
      tags:
        - api
  /api/v1/identity/invitations/accept:
    post:
      description: 로그인한 BATON 계정이 JSON 본문의 일회성 초대를 소비하고 팀 구성원과 결속된다.
      operationId: acceptInvitation
      parameters:
        - description: 현재 인증 세션에 결속된 CSRF 토큰
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              acceptInvitation:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              acceptInvitationAuthenticationRequired:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              acceptInvitationConflict:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              acceptInvitationCsrfInvalid:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              acceptInvitationExpired:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              acceptInvitationInvalidInput:
                value: |-
                  {
                    "token" : " "
                  }
              acceptInvitationNotFound:
                value: |-
                  {
                    "token" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
            schema:
              $ref: '#/components/schemas/Schema_aac1410174852626'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                acceptInvitation:
                  value: |-
                    {
                      "invitationId" : "55555555-2222-4333-8444-555555555555",
                      "accountId" : "22222222-2222-4333-8444-555555555555",
                      "teamId" : "33333333-2222-4333-8444-555555555555",
                      "memberId" : "44444444-2222-4333-8444-555555555555",
                      "boundAt" : "2026-07-30T12:00:00Z",
                      "role" : "OWNER"
                    }
              schema:
                $ref: '#/components/schemas/Schema_a140c43be9513214'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                acceptInvitationInvalidInput:
                  value: |-
                    {
                      "code" : "INVALID_INPUT",
                      "message" : "token: must not be blank"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '401':
          description: '401'
          content:
            application/json;charset=UTF-8:
              examples:
                acceptInvitationAuthenticationRequired:
                  value: |-
                    {
                      "code" : "AUTHENTICATION_REQUIRED",
                      "message" : "로그인이 필요합니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '403':
          description: '403'
          content:
            application/json;charset=UTF-8:
              examples:
                acceptInvitationCsrfInvalid:
                  value: |-
                    {
                      "code" : "CSRF_TOKEN_INVALID",
                      "message" : "CSRF 토큰이 없거나 올바르지 않습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '404':
          description: '404'
          content:
            application/json:
              examples:
                acceptInvitationNotFound:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_INVITATION_NOT_FOUND",
                      "message" : "bootstrap 초대를 찾을 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                acceptInvitationConflict:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_INVITATION_USED",
                      "message" : "bootstrap 초대가 이미 사용되었습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '410':
          description: '410'
          content:
            application/json:
              examples:
                acceptInvitationExpired:
                  value: |-
                    {
                      "code" : "BOOTSTRAP_INVITATION_EXPIRED",
                      "message" : "bootstrap 초대가 만료되었습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Cache-Control:
              description: 신원·세션 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      security:
        - batonSession: []
      summary: 구성원 초대 수락
      tags:
        - api
  /api/v1/identity/invitations/preview:
    post:
      description: 초대를 소비하기 전에 대상 팀·구성원·역할과 만료 시각을 확인한다.
      operationId: previewInvitation
      parameters:
        - description: 현재 인증 세션에 결속된 CSRF 토큰
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              previewInvitation:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              previewInvitationAuthenticationRequired:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              previewInvitationConflict:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              previewInvitationCsrfInvalid:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              previewInvitationExpired:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              previewInvitationInvalidInput:
                value: |-
                  {
                    "token" : " "
                  }
              previewInvitationNotFound:
                value: |-
                  {
                    "token" : "mi1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
            schema:
              $ref: '#/components/schemas/Schema_c0e8b67308aa6d97'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                previewInvitation:
                  value: |-
                    {
                      "teamId" : "33333333-3333-4333-8444-555555555555",
