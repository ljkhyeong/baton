      operationId: refreshRoundParticipationGrant
      parameters:
        - description: 참여할 정규 ROUND 방 ID
          in: path
          name: roomId
          required: true
          schema:
            maxLength: 14
            minLength: 14
            pattern: >-
              ^[abcdefghjkmnpqrstuvwxyz23456789]{4}-[abcdefghjkmnpqrstuvwxyz23456789]{4}-[abcdefghjkmnpqrstuvwxyz23456789]{4}$
            type: string
        - description: BATON 공개 출처와 정확히 같은 브라우저 출처
          example: https://baton.example
          in: header
          name: Origin
          required: true
          schema:
            type: string
        - description: 브라우저가 보낸 same-origin Fetch Metadata
          example: same-origin
          in: header
          name: Sec-Fetch-Site
          required: true
          schema:
            type: string
        - description: GET /api/v1/auth/csrf에서 받은 동적 CSRF 토큰
          example: opaque-csrf-token
          in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              refreshRoundParticipationGrant:
                value: |-
                  {
                    "teamId" : "11111111-1111-4111-8111-111111111111",
                    "seasonId" : "22222222-2222-4222-8222-222222222222",
                    "resourceId" : "44444444-4444-4444-8444-444444444444"
                  }
            schema:
              $ref: '#/components/schemas/Schema_489a30f5f524f979'
        required: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                refreshRoundParticipationGrant:
                  value: |-
                    {
                      "expiresAt" : 1786192796,
                      "refreshAfterSeconds" : 240
                    }
              schema:
                $ref: '#/components/schemas/Schema_afc5d14f14716d19'
          headers:
            Cache-Control:
              description: 민감 응답 캐시 금지
              schema:
                type: string
            Set-Cookie:
              description: 방 경로에 한정한 HttpOnly 참여권 쿠키
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: ROUND 참여권 갱신
      tags:
        - round
