openapi: 3.0.1
info:
  title: BATON API
  description: 조직의 역할, 루틴, 결정과 인수인계를 이어 주는 BATON HTTP API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/v1/system/status:
    get:
      description: BATON 서비스 이름과 서버 확인 시각을 조회한다.
      operationId: getSystemStatus
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getSystemStatus:
                  value: |-
                    {
                      "service" : "baton",
                      "checkedAt" : "2026-07-20T12:00:00Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_0e0fd397be8f012d'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 시스템 상태 조회
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/access-key/recover:
    post:
      description: 운영자 복구 키를 검증하고 새 워크스페이스 접근 키를 한 번 반환한다.
      operationId: recoverAccessKey
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 접근 키 복구 응답을 재생할 32~200자의 멱등 키
          example: access-key-change-restdocs-0000001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 200
            minLength: 32
            pattern: ^[A-Za-z0-9._~-]+$
            type: string
        - description: 설정된 파일럿 운영자 복구 키
          example: pilot-recovery-key
          in: header
          name: X-Baton-Recovery-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                recoverAccessKey:
                  value: |-
                    {
                      "accessKey" : "rotated-baton-access-key"
                    }
              schema:
                $ref: '#/components/schemas/Schema_721ee5b24f3a4ef0'
          headers:
            Cache-Control:
              description: 민감한 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '403':
          description: '403'
          content:
            application/json:
              examples:
                recoverAccessKeyDenied:
                  value: |-
                    {
                      "code" : "WORKSPACE_RECOVERY_DENIED",
                      "message" : "워크스페이스 접근 키를 복구할 권한이 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 접근 키 복구
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/access-key/rotate:
    post:
      description: 현재 접근 키를 검증하고 새 워크스페이스 접근 키를 한 번 반환한다.
      operationId: rotateAccessKey
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 접근 키 회전 응답을 재생할 32~200자의 멱등 키
          example: access-key-change-restdocs-0000001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 200
            minLength: 32
            pattern: ^[A-Za-z0-9._~-]+$
            type: string
        - description: 현재 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                rotateAccessKey:
                  value: |-
                    {
                      "accessKey" : "rotated-baton-access-key"
                    }
              schema:
                $ref: '#/components/schemas/Schema_1ffbbe40834589a9'
          headers:
            Cache-Control:
              description: 민감한 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                rotateAccessKeyConflict:
                  value: |-
                    {
                      "code" : "WORKSPACE_ACCESS_KEY_CONFLICT",
                      "message" : "접근 키가 동시에 변경되었습니다. 최신 키로 다시 시도해 주세요"
                    }
                rotateAccessKeyReplayExpired:
                  value: |-
                    {
                      "code" : "IDEMPOTENCY_REPLAY_EXPIRED",
                      "message" : "더 최신 작업이 완료되어 이 멱등 키의 응답을 더 이상 재생할 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 접근 키 회전
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/decisions:
    post:
      description: 결정과 이유, 검토한 대안, 작성자와 관련 역할을 기록한다.
      operationId: createDecision
      parameters:
        - description: 팀 UUID
