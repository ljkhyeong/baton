openapi: 3.0.1
info:
  title: BATON API
  description: 조직의 역할, 루틴, 결정과 인수인계를 이어 주는 BATON HTTP API
  version: 0.1.0
servers:
  - url: /
paths:
  /api/v1/system/status:
    get:
      description: BATON 서비스 이름과 서버 확인 시각을 조회한다.
      operationId: getSystemStatus
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                getSystemStatus:
                  value: |-
                    {
                      "service" : "baton",
                      "checkedAt" : "2026-07-20T12:00:00Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_0e0fd397be8f012d'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 시스템 상태 조회
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}:
    put:
      description: 종료되지 않은 시즌의 이름과 운영 기간을 기존 기록 경계 안에서 수정한다.
      operationId: updateSeason
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              updateSeason:
                value: |-
                  {
                    "name" : "2026 여름 시즌",
                    "startDate" : "2026-07-02",
                    "endDate" : "2026-09-17"
                  }
              updateSeasonAccessDenied:
                value: |-
                  {
                    "name" : "2026 여름 시즌",
                    "startDate" : "2026-07-02",
                    "endDate" : "2026-09-17"
                  }
              updateSeasonInvalidInput:
                value: |-
                  {
                    "name" : " ",
                    "startDate" : "2026-07-02",
                    "endDate" : "2026-09-17"
                  }
              updateSeasonNameConflict:
                value: |-
                  {
                    "name" : "2026 여름 시즌",
                    "startDate" : "2026-07-02",
                    "endDate" : "2026-09-17"
                  }
              updateSeasonNotFound:
                value: |-
                  {
                    "name" : "2026 여름 시즌",
                    "startDate" : "2026-07-02",
                    "endDate" : "2026-09-17"
                  }
            schema:
              $ref: '#/components/schemas/Schema_5baa3f1a60a86ba9'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                updateSeason:
                  value: |-
                    {
                      "id" : "22222222-2222-2222-2222-222222222222",
                      "name" : "2026 여름 시즌",
                      "startDate" : "2026-07-02",
                      "endDate" : "2026-09-17",
                      "endedAt" : null,
                      "previousSeasonId" : null,
                      "timeZone" : "Asia/Seoul",
                      "roundSchedule" : {
                        "firstMeetingDate" : "2026-08-06",
                        "meetingTime" : "20:00:00",
                        "recurrence" : "WEEKLY",
                        "generationLeadDays" : 7,
                        "enabled" : true,
                        "nextOccurrenceDate" : "2026-08-06"
                      }
                    }
              schema:
                $ref: '#/components/schemas/Schema_bce38b64b027ffab'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '400':
          description: '400'
          content:
            application/json:
              examples:
                updateSeasonInvalidInput:
                  value: |-
                    {
                      "code" : "INVALID_INPUT",
                      "message" : "name: must not be blank"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '403':
          description: '403'
          content:
            application/json:
              examples:
                updateSeasonAccessDenied:
                  value: |-
                    {
                      "code" : "WORKSPACE_ACCESS_DENIED",
                      "message" : "작업 공간 접근 키가 올바르지 않습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '404':
          description: '404'
          content:
            application/json:
              examples:
                updateSeasonNotFound:
                  value: |-
                    {
                      "code" : "SEASON_NOT_FOUND",
                      "message" : "시즌을 찾을 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                updateSeasonNameConflict:
                  value: |-
                    {
                      "code" : "SEASON_NAME_CONFLICT",
                      "message" : "같은 팀에 동일한 이름의 시즌이 이미 있습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 시즌 정보 수정
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/access-key/recover:
    post:
      description: 운영자 복구 키를 검증하고 새 워크스페이스 접근 키를 한 번 반환한다.
      operationId: recoverAccessKey
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 접근 키 복구 응답을 재생할 32~200자의 멱등 키
          example: access-key-change-restdocs-0000001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 200
            minLength: 32
            pattern: ^[A-Za-z0-9._~-]+$
            type: string
        - description: 설정된 파일럿 운영자 복구 키
          example: pilot-recovery-key
          in: header
          name: X-Baton-Recovery-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                recoverAccessKey:
                  value: |-
                    {
                      "accessKey" : "rotated-baton-access-key"
                    }
              schema:
                $ref: '#/components/schemas/Schema_721ee5b24f3a4ef0'
          headers:
            Cache-Control:
              description: 민감한 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '403':
          description: '403'
          content:
            application/json:
              examples:
                recoverAccessKeyDenied:
                  value: |-
                    {
                      "code" : "WORKSPACE_RECOVERY_DENIED",
                      "message" : "워크스페이스 접근 키를 복구할 권한이 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 접근 키 복구
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/access-key/rotate:
    post:
      description: 현재 접근 키를 검증하고 새 워크스페이스 접근 키를 한 번 반환한다.
      operationId: rotateAccessKey
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 접근 키 회전 응답을 재생할 32~200자의 멱등 키
          example: access-key-change-restdocs-0000001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 200
            minLength: 32
            pattern: ^[A-Za-z0-9._~-]+$
            type: string
        - description: 현재 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                rotateAccessKey:
                  value: |-
                    {
                      "accessKey" : "rotated-baton-access-key"
                    }
              schema:
                $ref: '#/components/schemas/Schema_1ffbbe40834589a9'
          headers:
            Cache-Control:
              description: 민감한 응답을 저장하지 않도록 하는 no-store 지시자
              schema:
                type: string
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                rotateAccessKeyConflict:
                  value: |-
                    {
                      "code" : "WORKSPACE_ACCESS_KEY_CONFLICT",
                      "message" : "접근 키가 동시에 변경되었습니다. 최신 키로 다시 시도해 주세요"
                    }
                rotateAccessKeyReplayExpired:
                  value: |-
                    {
                      "code" : "IDEMPOTENCY_REPLAY_EXPIRED",
                      "message" : "더 최신 작업이 완료되어 이 멱등 키의 응답을 더 이상 재생할 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 접근 키 회전
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/decisions:
    post:
      description: 결정과 이유, 검토한 대안, 작성자와 관련 역할을 기록한다.
      operationId: createDecision
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 같은 생성 요청을 안전하게 재시도할 32~200자의 URL 안전 멱등 키
          example: content-idempotency-restdocs-000001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 200
            minLength: 32
            pattern: ^[A-Za-z0-9._~-]+$
            type: string
        - description: 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              createDecision:
                value: |-
                  {
                    "title" : "질문은 모임 전날 마감한다",
                    "reason" : "진행자가 준비할 시간을 확보합니다",
                    "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                    "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                    "roleIds" : [ "44444444-4444-4444-4444-444444444444" ]
                  }
            schema:
              $ref: '#/components/schemas/Schema_c85be0da76b1d5f9'
        required: true
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                createDecision:
                  value: |-
                    {
                      "id" : "66666666-6666-6666-6666-666666666666",
                      "title" : "질문은 모임 전날 마감한다",
                      "reason" : "진행자가 준비할 시간을 확보합니다",
                      "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                      "createdAt" : "2026-07-20T03:04:05Z",
                      "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                      "authorName" : "박민서",
                      "roleIds" : [ "44444444-4444-4444-4444-444444444444" ],
                      "archivedAt" : null
                    }
              schema:
                $ref: '#/components/schemas/Schema_08317edd3bb7e846'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 결정 생성
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/decisions/{decisionId}:
    put:
      description: 결정의 내용, 이유, 대안, 작성자와 관련 역할을 정정한다.
      operationId: updateDecision
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 결정 UUID
          in: path
          name: decisionId
          required: true
          schema:
            format: uuid
            type: string
        - description: 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              updateDecision:
                value: |-
                  {
                    "title" : "질문은 모임 전날 마감한다",
                    "reason" : "진행자가 준비할 시간을 확보합니다",
                    "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                    "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                    "roleIds" : [ "44444444-4444-4444-4444-444444444444" ]
                  }
              updateDecisionContentConflict:
                value: |-
                  {
                    "title" : "질문은 모임 전날 마감한다",
                    "reason" : "진행자가 준비할 시간을 확보합니다",
                    "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                    "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                    "roleIds" : [ "44444444-4444-4444-4444-444444444444" ]
                  }
              updateDecisionNotFound:
                value: |-
                  {
                    "title" : "질문은 모임 전날 마감한다",
                    "reason" : "진행자가 준비할 시간을 확보합니다",
                    "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                    "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                    "roleIds" : [ "44444444-4444-4444-4444-444444444444" ]
                  }
            schema:
              $ref: '#/components/schemas/Schema_c85be0da76b1d5f9'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                updateDecision:
                  value: |-
                    {
                      "id" : "66666666-6666-6666-6666-666666666666",
                      "title" : "질문은 모임 전날 마감한다",
                      "reason" : "진행자가 준비할 시간을 확보합니다",
                      "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                      "createdAt" : "2026-07-20T03:04:05Z",
                      "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                      "authorName" : "박민서",
                      "roleIds" : [ "44444444-4444-4444-4444-444444444444" ],
                      "archivedAt" : null
                    }
              schema:
                $ref: '#/components/schemas/Schema_08317edd3bb7e846'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '404':
          description: '404'
          content:
            application/json:
              examples:
                updateDecisionNotFound:
                  value: |-
                    {
                      "code" : "DECISION_NOT_FOUND",
                      "message" : "결정 기록을 찾을 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '409':
          description: '409'
          content:
            application/json:
              examples:
                updateDecisionContentConflict:
                  value: |-
                    {
                      "code" : "WORKSPACE_CONTENT_CONFLICT",
                      "message" : "다른 사용자가 먼저 내용을 변경했습니다. 최신 내용을 확인한 뒤 다시 시도해 주세요"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
      summary: 결정 수정
      tags:
        - api
  /api/v1/teams/{teamId}/seasons/{seasonId}/decisions/{decisionId}/archive:
    patch:
      description: 결정 기록을 활성 목록에서 보관하거나 다시 복원한다.
      operationId: updateDecisionArchive
      parameters:
        - description: 팀 UUID
          in: path
          name: teamId
          required: true
          schema:
            format: uuid
            type: string
        - description: 시즌 UUID
          in: path
          name: seasonId
          required: true
          schema:
            format: uuid
            type: string
        - description: 결정 UUID
          in: path
          name: decisionId
          required: true
          schema:
            format: uuid
            type: string
        - description: 워크스페이스 접근 키
          example: baton-access-key
          in: header
          name: X-Baton-Access-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              updateDecisionArchive:
                value: |-
                  {
                    "archived" : true
                  }
              updateDecisionArchiveContentConflict:
                value: |-
                  {
                    "archived" : true
                  }
              updateDecisionArchiveNotFound:
                value: |-
                  {
                    "archived" : true
                  }
            schema:
              $ref: '#/components/schemas/Schema_647b579478fb2e28'
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                updateDecisionArchive:
                  value: |-
                    {
                      "id" : "66666666-6666-6666-6666-666666666666",
                      "title" : "질문은 모임 전날 마감한다",
                      "reason" : "진행자가 준비할 시간을 확보합니다",
                      "alternative" : "모임 당일에도 받는 방안을 검토했습니다",
                      "createdAt" : "2026-07-20T03:04:05Z",
                      "authorMemberId" : "33333333-3333-3333-3333-333333333333",
                      "authorName" : "박민서",
                      "roleIds" : [ "44444444-4444-4444-4444-444444444444" ],
                      "archivedAt" : "2026-07-20T04:05:06Z"
                    }
              schema:
                $ref: '#/components/schemas/Schema_08317edd3bb7e846'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
              schema:
                type: string
        '404':
          description: '404'
          content:
            application/json:
              examples:
                updateDecisionArchiveNotFound:
                  value: |-
                    {
                      "code" : "DECISION_NOT_FOUND",
                      "message" : "결정 기록을 찾을 수 없습니다"
                    }
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-ID:
              description: 서버가 생성한 불투명 요청 진단 식별자
