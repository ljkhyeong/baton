        required: true
      responses:
        '201':
          description: '201'
          content:
            application/json:
              examples:
                createDecision:
                  value: |-
                    {
                      "id" : "66666666-6666-6666-6666-666666666666",
                      "title" : "질문은 모임 전날 마감한다",
                      "reason" : "진행자가 준비할 시간을 확보합니다",
