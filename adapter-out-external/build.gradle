dependencies {
	implementation project(':application')

	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.security:spring-security-crypto'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation('com.networknt:json-schema-validator:3.0.6') {
		exclude group: 'tools.jackson.dataformat', module: 'jackson-dataformat-yaml'
	}
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.resources.srcDir rootProject.file('contracts')

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'crossservice', 'calendar-crossservice', 'calendar-metadata-crossservice',
				'calendar-recovery-crossservice'
	}
}

def roundSignalingJar = providers.gradleProperty('roundSignalingJar')
		.orElse(providers.environmentVariable('ROUND_SIGNALING_JAR'))

tasks.register('roundConsumerContractTest', Test) {
	group = 'verification'
	description = '실제 BATON 참여권을 외부 ROUND 시그널링 런타임에서 검증'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform {
		includeTags 'crossservice'
	}

	doFirst {
		if (!roundSignalingJar.isPresent()) {
			throw new GradleException(
					'ROUND signaling bootJar 경로가 필요합니다. '
							+ '-ProundSignalingJar=/absolute/path/signaling.jar 또는 '
							+ 'ROUND_SIGNALING_JAR 환경 변수를 지정하세요.'
			)
		}
		File signalingJar = file(roundSignalingJar.get())
		if (!signalingJar.isFile()) {
			throw new GradleException(
					'ROUND signaling bootJar를 찾을 수 없습니다: '
							+ signalingJar.absolutePath
			)
		}
		systemProperty 'round.signaling.jar', signalingJar.absolutePath
	}
}

def calendarBaseUrl = providers.environmentVariable('BATON_CAL_LIVE_BASE_URL')
def calendarBearerToken = providers.environmentVariable('BATON_CAL_LIVE_BEARER_TOKEN')
def calendarCandidateContractRoot = providers.gradleProperty('calendarCandidateContractRoot')

tasks.register('calendarConsumerContractTest', Test) {
	group = 'verification'
	description = 'BATON CAL 실제 런타임에서 일정 스냅샷 생산자 계약 검증'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform {
		includeTags 'calendar-crossservice'
		if (calendarCandidateContractRoot.isPresent()) {
			includeTags 'calendar-metadata-crossservice'
		}
	}

	doFirst {
		if (!calendarBaseUrl.isPresent() || !calendarBearerToken.isPresent()) {
			throw new GradleException(
					'BATON_CAL_LIVE_BASE_URL과 BATON_CAL_LIVE_BEARER_TOKEN이 필요합니다.'
			)
		}
		if (calendarCandidateContractRoot.isPresent()) {
			systemProperty 'calendar.candidate.contract.root',
					file(calendarCandidateContractRoot.get()).absolutePath
		}
	}
}

tasks.register('calendarRecoveryConsumerContractTest', Test) {
	group = 'verification'
	description = 'BATON CAL 실제 복구 모드에서 매니페스트와 완료 계약 검증'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform {
		includeTags 'calendar-recovery-crossservice'
	}

	doFirst {
		if (!calendarBaseUrl.isPresent() || !calendarBearerToken.isPresent()) {
			throw new GradleException(
					'BATON_CAL_LIVE_BASE_URL과 BATON_CAL_LIVE_BEARER_TOKEN이 필요합니다.'
			)
		}
	}
}
