tasks.register('useCaseTest', Test) {
	group = 'verification'
	description = '유스케이스 통합 테스트 (@Tag("usecase"))'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'usecase' }
}

tasks.register('policyTest', Test) {
	group = 'verification'
	description = '도메인 정책과 아키텍처 테스트 (@Tag("policy"))'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'policy' }
}

dependencies {
	api project(':domain')

	implementation 'org.springframework:spring-context'
	implementation 'org.springframework:spring-tx'
	implementation 'org.springframework.security:spring-security-crypto'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework:spring-jdbc'
	testImplementation 'org.springframework:spring-web'
	testImplementation 'tools.jackson.core:jackson-databind'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.flywaydb:flyway-core'
	testImplementation 'org.hibernate.orm:hibernate-core'
	testImplementation 'io.micrometer:micrometer-core'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
	testImplementation project(':adapter-in-web')
	testImplementation project(':adapter-out-persistence')
	testImplementation project(':adapter-out-external')
	testImplementation project(':bootstrap')
	testRuntimeOnly 'org.flywaydb:flyway-mysql'
	testRuntimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform {
		if (name == 'test') {
			excludeTags 'crossservice'
		}
		if (name != 'calendarMetadataOutboxContractTest') {
			excludeTags 'calendar-outbox-crossservice'
		}
	}
}

tasks.register('calendarMetadataOutboxContractTest', Test) {
	group = 'verification'
	description = '실제 BATON 원본·아웃박스에서 CAL 시즌 이름까지 전달 검증'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform { includeTags 'calendar-outbox-crossservice' }
}

def briefBootJar = providers.gradleProperty('briefBootJar')
		.orElse(providers.environmentVariable('BRIEF_BOOT_JAR'))

tasks.register('briefCrossServiceTest', Test) {
	group = 'verification'
	description = '실제 BATON·BRIEF 실행 JAR의 이벤트 전달과 비공개 HTTPS 에디션 경계를 검증'
	dependsOn ':bootstrap:bootJar'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }
	useJUnitPlatform {
		includeTags 'crossservice'
	}

	doFirst {
		if (!briefBootJar.isPresent()) {
			throw new GradleException(
					'BRIEF bootJar 경로가 필요합니다. '
							+ '-PbriefBootJar=/absolute/path/bootstrap.jar 또는 '
							+ 'BRIEF_BOOT_JAR 환경 변수를 지정하세요.'
			)
		}
		File briefJar = rootProject.file(briefBootJar.get())
		if (!briefJar.isFile()) {
			throw new GradleException('BRIEF bootJar를 찾을 수 없습니다: ' + briefJar.absolutePath)
		}
		File batonJar = project(':bootstrap').tasks.named('bootJar').get()
				.archiveFile.get().asFile
		systemProperty 'baton.boot.jar', batonJar.absolutePath
		systemProperty 'brief.boot.jar', briefJar.absolutePath
	}
}
