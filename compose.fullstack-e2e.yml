services:
  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment:
      MYSQL_DATABASE: baton_fullstack_e2e
      MYSQL_ROOT_PASSWORD: fullstack-root-password
      MYSQL_USER: baton_fullstack_e2e
      MYSQL_PASSWORD: fullstack-database-password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE}
          -e 'SELECT 1' >/dev/null 2>&1
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 10s
